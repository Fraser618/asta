<style>
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#17211A; --ink2:#5A6A5E;
  --line:#D5DFD7; --accent:#A87C1F; --accent-ink:#FFFFFF;
  --good:#1F7A46; --warn:#B0741C; --bad:#B23A2E;
  --rP:#C77A16; --rD:#2E8B57; --rC:#2C6CB0; --rA:#C0392B;
  --chip-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111713; --surface:#1B241E; --surface2:#232E27; --ink:#E8EFE9; --ink2:#93A398;
  --line:#2E3B33; --accent:#D9A83F; --accent-ink:#17130A;
  --good:#4BC37E; --warn:#E0A83D; --bad:#E06055;
}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1B241E; --surface2:#232E27; --ink:#E8EFE9; --ink2:#93A398;
  --line:#2E3B33; --accent:#D9A83F; --accent-ink:#17130A;
  --good:#4BC37E; --warn:#E0A83D; --bad:#E06055;
}
:root[data-theme="light"]{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#17211A; --ink2:#5A6A5E;
  --line:#D5DFD7; --accent:#A87C1F; --accent-ink:#FFFFFF;
  --good:#1F7A46; --warn:#B0741C; --bad:#B23A2E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.num{font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:12px}
.topbar .credits{font-size:24px;font-weight:800;color:var(--accent)}
.topbar .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.slotrow{display:flex;gap:8px;margin-left:auto}
.slotrow .s{text-align:center;min-width:34px}
.slotrow .s b{display:block;font-size:15px}
.slotrow .s span{font-size:10px;letter-spacing:.05em;color:var(--ink2)}
main{max-width:640px;margin:0 auto;padding:12px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px, env(safe-area-inset-bottom))}
.tabbar button{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:600;color:var(--ink2);border-radius:10px}
.tabbar button.on{color:var(--accent)}
.tabbar button .ico{display:block;font-size:20px;line-height:1.1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;font-weight:700}
.rolechips{display:flex;gap:8px;margin-bottom:12px}
.rolechips button{flex:1;padding:10px 0;border-radius:10px;font-weight:800;font-size:16px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.rolechips button.on{color:#fff;border-color:transparent}
.rolechips button.onP{background:var(--rP)} .rolechips button.onD{background:var(--rD)}
.rolechips button.onC{background:var(--rC)} .rolechips button.onA{background:var(--rA)}
.chip{display:inline-block;min-width:22px;text-align:center;padding:2px 6px;border-radius:6px;color:#fff;font-size:12px;font-weight:800}
.chipP{background:var(--rP)}.chipD{background:var(--rD)}.chipC{background:var(--rC)}.chipA{background:var(--rA)}
.fascia{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2)}
.fascia.hot{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:none}
.plist .nm{font-weight:700}
.plist .tm{font-size:12px;color:var(--ink2)}
.plist .right{margin-left:auto;text-align:right}
.plist button.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0}
.sold{opacity:.45}
.sold .nm{text-decoration:line-through}
.pcard .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tgt{margin-left:auto;font-size:24px;opacity:.3;filter:grayscale(1);padding:2px 6px;border-radius:8px}
.tgt.on{opacity:1;filter:none;background:var(--surface2)}
.tabbar button{font-size:12px}
.pcard .head .n{font-size:26px;font-weight:800;text-wrap:balance}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.metric{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.metric .v{font-size:22px;font-weight:800}
.metric .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.metric.stima .v{color:var(--accent)}
.metric.piano .v{color:var(--good)}
.metric.abs .v{color:var(--warn)}
.advice{border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;margin:10px 0}
.rivals{margin:10px 0 0}
.rivals .rr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rivals .rr:last-child{border-bottom:none}
.buy{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pricebox{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.pricebox input{font-size:24px;font-weight:800;text-align:center;max-width:110px;padding:8px}
.pricebox button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 0;flex:1;font-weight:700;font-size:15px}
.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.teamgrid button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.teamgrid button .cr{font-size:12px;color:var(--ink2)}
.teamgrid button:disabled{opacity:.35;cursor:not-allowed}
.teamgrid button.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.searchwrap{position:relative;margin-bottom:12px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.results button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:none}
.log li{font-size:14px}
.undo{color:var(--bad);font-weight:700;font-size:13px;padding:6px 10px;border:1px solid var(--bad);border-radius:8px}
.teamcard .hd{display:flex;justify-content:space-between;align-items:baseline}
.teamcard .hd .nm{font-weight:800;font-size:17px}
.teamcard .hd .cr{font-weight:800;color:var(--accent);font-size:20px}
.teamcard .sub{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.teamcard .ros{font-size:13px;display:grid;gap:2px}
.teamcard .ros div{display:flex;gap:8px}
.teamcard .ros .pr{margin-left:auto;font-weight:700}
.planrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.planrow label{width:130px;font-weight:600;font-size:14px}
.planrow input{max-width:100px;text-align:center;font-weight:700}
.warn{color:var(--warn);font-size:13px;font-weight:600}
.bad{color:var(--bad)} .goodc{color:var(--good)}
.mut{color:var(--ink2);font-size:13px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:12px 16px;width:100%;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--bad);border:1px solid var(--bad)}
.tiergrp{margin-bottom:14px}
.tiergrp h3{font-size:14px;margin:0 0 4px;color:var(--accent)}
.infl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.infl .tag{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.hidden{display:none}
@media (prefers-reduced-motion: no-preference){ .card{transition:border-color .15s} }

function norm(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function baseline(p){ return Math.max(1, p.fvm); }
function soldMap(){ const m={}; S.purchases.forEach(b => m[b.pid]=b); return m; }
function teamState(ti){
  const st = {spent:0, roleSpent:{P:0,D:0,C:0,A:0}, roleCount:{P:0,D:0,C:0,A:0}, roster:[]};
  S.purchases.forEach(b => { if(b.team===ti){ const p=byId[b.pid]; st.spent+=b.price; st.roleSpent[p.r]+=b.price; st.roleCount[p.r]++; st.roster.push(b); }});
  st.credits = START - st.spent;
  st.slotsLeft = 25 - st.roster.length;
  st.maxBid = st.slotsLeft>0 ? st.credits - (st.slotsLeft-1) : 0;
  return st;
}
function ratioFor(role, macro){
  const sold = soldMap();
  const samples = (filter) => S.purchases
    .map(b => ({p:byId[b.pid], price:b.price}))
    .filter(x => x.p.fascia && filter(x.p))
    .map(x => x.price / baseline(x.p));
  let r = samples(p => p.r===role && MACRO[p.fascia]===macro);
  let scope = 'stessa fascia e ruolo';
  if(r.length < 2){ r = samples(p => MACRO[p.fascia]===macro); scope = 'stessa fascia, tutti i ruoli'; }
  if(r.length < 2){ r = samples(p => true); scope = 'tutta l’asta'; }
  if(r.length === 0) return {ratio:1, n:0, scope:'nessun dato'};
  r.sort((a,b)=>a-b);
  const med = r.length%2 ? r[(r.length-1)/2] : (r[r.length/2-1]+r[r.length/2])/2;
  return {ratio:med, n:r.length, scope};
}
function stima(p){
  if(!p.fascia) return {v: baseline(p), n:0, scope:'solo quotazione'};
  const {ratio, n, scope} = ratioFor(p.r, MACRO[p.fascia]);
  return {v: Math.max(1, Math.round(baseline(p)*ratio)), n, scope};
}

function render(){
  renderTop();
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab===S.tab));
  const m = $('#main'); m.innerHTML='';
  if(S.tab==='asta') renderAsta(m);
  else if(S.tab==='obiettivi') renderObiettivi(m);
  else if(S.tab==='rose') renderRose(m);
  else if(S.tab==='fasce') renderFasce(m);
  else renderPiano(m);
  save();
}

function playerRow(p, withStima){
  const sold = soldMap()[p.id];
  const st = withStima && !sold ? stima(p) : null;
  return `<button class="row ${sold?'sold':''}" data-sel="${p.id}">
    <span class="chip chip${p.r}">${p.r}</span>
    <span><span class="nm">${S.targets.includes(p.id)?'🎯 ':''}${esc(p.n)}</span><br><span class="tm">${esc(p.sq)}${p.fascia? ' · '+esc(p.fascia):''}</span></span>
    <span class="right num">${sold ? `<b>${sold.price}</b><br><span class="tm">${esc(S.teams[sold.team])}</span>`
        : st ? `<b style="color:var(--accent)">~${st.v}</b><br><span class="tm">fvm ${p.fvm}</span>` : `<span class="tm">fvm ${p.fvm}</span>`}</span>
  </button>`;
}

function renderAsta(m){
  m.append(h(`<div class="searchwrap"><input id="q" type="search" placeholder="Cerca giocatore… (nome o squadra)" autocomplete="off" enterkeyhint="search"><div class="results hidden" id="res"></div></div>`));
  if(S.sel != null && byId[S.sel]) m.append(renderPlayerCard(byId[S.sel]));
  // registro
  const last = S.purchases.slice(-4).reverse();
  if(last.length){
    m.append(h(`<div class="card"><h2>Ultimi acquisti <button class="undo" id="undo" style="float:right">↩ Annulla ultimo</button></h2>
      <ul class="plist log">${last.map(b => { const p=byId[b.pid];
        return `<li><span class="chip chip${p.r}">${p.r}</span><span class="nm">${esc(p.n)}</span>
        <span class="right num"><b>${b.price}</b> → ${esc(S.teams[b.team])}</span></li>`; }).join('')}</ul></div>`));
  }
  // prossimi nel ruolo (ordine alfabetico)
  const role = S.role;
  const sold = soldMap();
  const next = PLAYERS.filter(p => p.r===role && !sold[p.id] && p.fascia)
    .sort((a,b)=> norm(a.n) < norm(b.n) ? -1 : 1);
  m.append(h(`<div class="card"><h2>In arrivo — ordine alfabetico (${next.length} in guida)</h2>
    <div class="rolechips">${ROLES.map(r=>`<button data-role="${r}" class="${r===role?'on on'+r:''}">${r}</button>`).join('')}</div>
    <ul class="plist">${next.slice(0,40).map(p=>`<li>${playerRow(p,true)}</li>`).join('')}</ul>
    ${next.length>40?`<div class="mut">…e altri ${next.length-40}</div>`:''}</div>`));
  wireCommon(m);
  const q = $('#q'), res = $('#res');
  q.addEventListener('input', ()=>{
    const v = norm(q.value).trim();
    if(v.length<2){ res.classList.add('hidden'); return; }
    const hits = PLAYERS.filter(p => norm(p.n).includes(v) || norm(p.sq).startsWith(v))
      .sort((a,b)=> (norm(a.n).startsWith(v)?0:1)-(norm(b.n).startsWith(v)?0:1) || b.fvm-a.fvm).slice(0,12);
    res.innerHTML = hits.map(p=>playerRow(p,true)).join('') || '<div class="mut" style="padding:10px">Nessun risultato</div>';
    res.classList.remove('hidden');
    res.querySelectorAll('[data-sel]').forEach(b=>b.addEventListener('click', ()=>{ S.sel=+b.dataset.sel; S.price=1; render(); }));
  });
}

function renderPlayerCard(p){
  const sold = soldMap()[p.id];
  const me = teamState(0);
  const st = stima(p);
  const mySlotsRole = SLOTS[p.r]-me.roleCount[p.r];
  const pianoLeft = S.plan[p.r]-me.roleSpent[p.r];
  const pianoCap = mySlotsRole>0 ? pianoLeft-(mySlotsRole-1) : 0;
  const absCap = mySlotsRole>0 ? me.maxBid : 0;
  const rivals = [];
  for(let i=1;i<NTEAMS;i++){ const ts=teamState(i);
    if(SLOTS[p.r]-ts.roleCount[p.r] > 0 && ts.slotsLeft>0) rivals.push({i, max:ts.maxBid, open:SLOTS[p.r]-ts.roleCount[p.r]}); }
  rivals.sort((a,b)=>b.max-a.max);
  const cap = Math.max(0, Math.min(pianoCap, absCap));
  const rivalMax = rivals.length ? rivals[0].max : 0;
  let advice;
  if(sold) advice = `Già assegnato a <b>${esc(S.teams[sold.team])}</b> per <b>${sold.price}</b>.`;
  else if(mySlotsRole<=0) advice = `<span class="bad">Reparto ${ROLENAME[p.r].toLowerCase()} già completo: non puoi comprarlo.</span>`;
  else {
    advice = `Secondo il piano puoi spingerti fino a <b class="goodc">${cap}</b>.`;
    if(rivalMax < st.v) advice += ` I rivali si fermano a <b>${rivalMax}</b>: a <b>${Math.min(cap, rivalMax+1)}</b> nessuno può superarti.`;
    else advice += ` Il rivale più pericoloso può arrivare a <b class="bad">${rivalMax}</b>.`;
    if(st.v > cap) advice += ` <span class="warn">La stima (${st.v}) supera il tuo tetto: rischi di sforare il piano.</span>`;
  }
  const over = rivals.filter(r=>r.max>=st.v).length;
  const frag = h(`<div class="card pcard">
    <div class="head"><span class="chip chip${p.r}">${p.r}</span><span class="n">${esc(p.n)}</span><span class="tm">${esc(p.sq)}</span>
      ${p.fascia?`<span class="fascia ${MACRO[p.fascia]==='top'?'hot':''}">${esc(p.fascia)}</span>`:'<span class="fascia">fuori guida</span>'}
      <button class="tgt ${S.targets.includes(p.id)?'on':''}" data-tgt title="Segna come obiettivo">🎯</button></div>
    <div class="metrics">
      <div class="metric stima"><div class="v num">~${st.v}</div><div class="k">Stima</div></div>
      <div class="metric piano"><div class="v num">${cap}</div><div class="k">Tetto piano</div></div>
      <div class="metric abs"><div class="v num">${absCap}</div><div class="k">Tetto assoluto</div></div>
    </div>
    <div class="mut num">Base FVM ${p.fvm} · Qt ${p.qt} · stima su ${st.n} acquisti (${st.scope}) · ${over} rivali possono pagare la stima</div>
    <div class="advice">${advice}</div>
    <div class="rivals">${rivals.slice(0,3).map(r=>`<div class="rr"><span>${esc(S.teams[r.i])} <span class="mut">(${r.open} slot ${p.r})</span></span><b class="num">fino a ${r.max}</b></div>`).join('')}</div>
    ${!sold?`<div class="buy">
      <div class="pricebox">
        <button data-d="-1">−1</button>
        <input id="price" class="num" type="number" inputmode="numeric" min="1" value="${S.price||1}">
        <button data-d="1">+1</button><button data-d="5">+5</button><button data-d="10">+10</button>
      </div>
      <div class="teamgrid">${S.teams.map((t,i)=>{ const ts=teamState(i);
        const can = SLOTS[p.r]-ts.roleCount[p.r] > 0;
        return `<button data-buy="${i}" ${can?'':'disabled'} class="${i===0?'me':''}">${esc(t)}<span class="cr num">${ts.credits} cr</span></button>`;}).join('')}</div>
      <div class="mut" style="margin-top:8px">Tocca la squadra che se lo aggiudica al prezzo impostato.</div>
    </div>`:''}
  </div>`);
  frag.querySelector('[data-tgt]').addEventListener('click', ()=>{
    const i = S.targets.indexOf(p.id);
    if(i>=0) S.targets.splice(i,1); else S.targets.push(p.id);
    render();
  });
  const price = frag.querySelector('#price');
  frag.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click', ()=>{
    price.value = Math.max(1, (+price.value||1) + +b.dataset.d); S.price=+price.value; save();
  }));
  if(price) price.addEventListener('input', ()=>{ S.price=+price.value; save(); });
  frag.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>{
    const ti = +b.dataset.buy, pr = Math.max(1, +price.value||1);
    const ts = teamState(ti);
    if(pr > ts.maxBid && !confirm(`${S.teams[ti]} supererebbe il suo massimo teorico (${ts.maxBid}). Registrare comunque?`)) return;
    S.purchases.push({pid:p.id, team:ti, price:pr, ts:Date.now()});
    S.sel=null; S.price=1; render();
  }));
  return frag;
}

function renderObiettivi(m){
  const sold = soldMap();
  const tg = S.targets.map(id=>byId[id]).filter(Boolean)
    .sort((a,b)=> ROLES.indexOf(a.r)-ROLES.indexOf(b.r) || (norm(a.n)<norm(b.n)?-1:1));
  if(!tg.length){
    m.append(h(`<div class="card"><h2>Obiettivi</h2><div class="mut">Nessun obiettivo segnato. Cerca un giocatore nel tab Asta e tocca 🎯 sulla sua scheda per aggiungerlo qui.</div></div>`));
    return;
  }
  const me = teamState(0);
  const remaining = tg.filter(p=>!sold[p.id]);
  const sumSt = remaining.reduce((a,p)=>a+stima(p).v,0);
  const avail = me.credits - Math.max(0, me.slotsLeft - remaining.length);
  const margin = avail - sumSt;
  m.append(h(`<div class="card"><h2>Bilancio obiettivi (${remaining.length} rimasti)</h2>
    <div class="metrics">
      <div class="metric stima"><div class="v num">${sumSt}</div><div class="k">Stima totale</div></div>
      <div class="metric piano"><div class="v num">${avail}</div><div class="k">Spendibili</div></div>
      <div class="metric ${margin>=0?'piano':'abs'}"><div class="v num ${margin>=0?'goodc':'bad'}">${margin>=0?'+':''}${margin}</div><div class="k">Margine</div></div>
    </div>
    <div class="${margin>=0?'mut':'warn'}">${margin>=0
      ? 'Ai prezzi stimati i crediti bastano per tutti gli obiettivi rimasti (tenendo 1 cr per ogni altro slot).'
      : 'Ai prezzi stimati NON ti bastano i crediti: taglia un obiettivo o preparati a mollarne uno in asta.'}</div>
  </div>`));
  const rows = tg.map(p=>{
    const s2 = sold[p.id];
    if(s2){
      const mine = s2.team===0;
      return `<li style="flex-wrap:wrap"><button class="row ${mine?'':'sold'}" data-sel="${p.id}">
        <span class="chip chip${p.r}">${p.r}</span>
        <span><span class="nm">${esc(p.n)}</span><br><span class="tm">${p.fascia?esc(p.fascia):''}</span></span>
        <span class="right num">${mine
          ? `<b class="goodc">✓ tuo a ${s2.price}</b>`
          : `<b class="bad">perso</b><br><span class="tm">${esc(S.teams[s2.team])} · ${s2.price}</span>`}</span>
      </button></li>`;
    }
    const st = stima(p);
    const rivals = [];
    for(let i=1;i<NTEAMS;i++){ const ts=teamState(i);
      if(SLOTS[p.r]-ts.roleCount[p.r] > 0 && ts.slotsLeft>0) rivals.push({i, max:ts.maxBid}); }
    rivals.sort((a,b)=>b.max-a.max);
    const canPay = rivals.filter(r=>r.max>=st.v).length;
    const top = rivals[0];
    const danger = top
      ? (top.max >= st.v
        ? `<span class="warn">⚠️ Pericolo: <b>${esc(S.teams[top.i])}</b> può arrivare a ${top.max} · ${canPay} rival${canPay===1?'e':'i'} in grado di pagare la stima</span>`
        : `<span class="goodc">Nessun rivale arriva alla stima (il più vicino: ${esc(S.teams[top.i])}, ${top.max})</span>`)
      : `<span class="goodc">Nessun rivale ha slot liberi nel ruolo</span>`;
    return `<li style="flex-wrap:wrap"><button class="row" data-sel="${p.id}">
      <span class="chip chip${p.r}">${p.r}</span>
      <span><span class="nm">${esc(p.n)}</span><br><span class="tm">${esc(p.sq)}${p.fascia?' · '+esc(p.fascia):''}</span></span>
      <span class="right num"><b style="color:var(--accent)">~${st.v}</b><br><span class="tm">su ${st.n} acquisti</span></span>
    </button><div class="mut num" style="width:100%;padding:2px 0 4px 32px">${danger}</div></li>`;
  }).join('');
  m.append(h(`<div class="card"><h2>I tuoi obiettivi</h2><ul class="plist">${rows}</ul>
    <div class="mut" style="margin-top:8px">Tocca un giocatore per aprire la scheda (e da lì togliere il 🎯). Le stime si aggiornano a ogni acquisto registrato.</div></div>`));
  wireCommon(m);
}

function renderRose(m){
  for(let i=0;i<NTEAMS;i++){
    const ts = teamState(i);
    const grouped = ROLES.map(r=>{
      const rows = ts.roster.filter(b=>byId[b.pid].r===r)
        .map(b=>`<div><span class="chip chip${r}">${r}</span> ${esc(byId[b.pid].n)} <span class="pr num">${b.price}</span></div>`).join('');
      return rows;
    }).join('');
    m.append(h(`<div class="card teamcard">
      <div class="hd"><span class="nm">${i===0?'⭐ ':''}${esc(S.teams[i])}</span><span class="cr num">${ts.credits}</span></div>
      <div class="sub num">max offerta ${ts.maxBid} · slot: ${ROLES.map(r=>`${r} ${ts.roleCount[r]}/${SLOTS[r]}`).join(' · ')}</div>
      <div class="ros">${grouped || '<span class="mut">Nessun acquisto</span>'}</div>
    </div>`));
  }
}

function renderFasce(m){
  const role = S.role;
  const infl = ['top','semi','alta','media','low'].map(g=>{
    const {ratio,n} = ratioFor(role,g);
    return `<span class="tag">${MACRONAME[g]}: <b class="num">${n?'×'+ratio.toFixed(2):'—'}</b>${n?` <span class="mut">(${n})</span>`:''}</span>`;
  }).join('');
  const sold = soldMap();
  const tiers = TIER_ORDER.map(t=>{
    const ps = PLAYERS.filter(p=>p.r===role && p.fascia===t);
    if(!ps.length) return '';
    return `<div class="tiergrp"><h3>${esc(t)}</h3><ul class="plist">${ps.map(p=>`<li>${playerRow(p,true)}</li>`).join('')}</ul></div>`;
  }).join('');
  m.append(h(`<div class="card">
    <div class="rolechips">${ROLES.map(r=>`<button data-role="${r}" class="${r===role?'on on'+r:''}">${r}</button>`).join('')}</div>
    <h2>Inflazione osservata — ${ROLENAME[role]}</h2>
    <div class="infl">${infl}</div>${tiers}</div>`));
  wireCommon(m);
}

function renderPiano(m){
  const me = teamState(0);
  const sum = ROLES.reduce((a,r)=>a+S.plan[r],0);
  m.append(h(`<div class="card"><h2>Budget per reparto (totale ${START})</h2>
    ${ROLES.map(r=>`<div class="planrow"><label>${ROLENAME[r]}</label>
      <input data-plan="${r}" class="num" type="number" inputmode="numeric" min="${SLOTS[r]}" value="${S.plan[r]}">
      <span class="mut num">speso ${me.roleSpent[r]}</span></div>`).join('')}
    <div class="${sum===START?'mut':'warn'} num">Somma: ${sum} / ${START}${sum!==START?' — non torna!':''}</div>
    <div class="mut" style="margin-top:6px">Riferimento mediano SOS Fanta: 7% P · 19% D · 32% C · 42% A → 70 / 190 / 320 / 420.</div>
  </div>
  <div class="card"><h2>Squadre (la prima sei tu)</h2>
    ${S.teams.map((t,i)=>`<div class="planrow"><label>${i===0?'⭐ Tu':'Squadra '+(i+1)}</label><input data-team="${i}" value="${esc(t)}"></div>`).join('')}
  </div>
  <div class="card"><h2>Zona pericolosa</h2>
    <button class="btn ghost" id="reset">Azzera tutta l'asta</button>
    <div class="mut" style="margin-top:6px">Cancella acquisti e nomi. I dati vivono solo su questo dispositivo (localStorage).</div>
  </div>`));
  m.querySelectorAll('[data-plan]').forEach(inp=>inp.addEventListener('change', ()=>{ S.plan[inp.dataset.plan]=Math.max(0,+inp.value||0); render(); }));
  m.querySelectorAll('[data-team]').forEach(inp=>inp.addEventListener('change', ()=>{ S.teams[inp.dataset.team]=inp.value.trim()||('Squadra '+(+inp.dataset.team+1)); save(); }));
  $('#reset').addEventListener('click', ()=>{ if(confirm('Sicuro? Cancella TUTTI gli acquisti registrati.')){ try{ localStorage.removeItem(KEY); }catch(e){} S=null; S=load(); render(); }});
}

function wireCommon(m){
  m.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click', ()=>{ S.role=b.dataset.role; render(); }));
  m.querySelectorAll('.plist [data-sel]').forEach(b=>b.addEventListener('click', ()=>{ S.sel=+b.dataset.sel; S.price=1; S.tab='asta'; render(); }));
  const u = m.querySelector('#undo');
  if(u) u.addEventListener('click', ()=>{ const b=S.purchases.pop(); if(b) S.sel=b.pid; render(); });
}

document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click', ()=>{ S.tab=b.dataset.tab; render(); }));
render();
</script>

</html>
